name: Daily Morning Market Report

on:
  workflow_dispatch: # 支援手動隨時觸發
  schedule:
    # UTC 00:00 = 台灣時間 08:00 (每天早上開盤前)
    - cron: '0 0 * * *'

jobs:
  run-market-news:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝依賴套件
        run: pip install requests feedparser groq

      - name: 執行新聞彙整與 AI 分析推播
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python market_director.py
